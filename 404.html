<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not found | Stefano van Tongeren</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root { --paper: #f4f1ea; --ink: #15161a; --muted: #67655f; --rule: #dcd7cb; --signal: #d9461a; }
    @media (prefers-color-scheme: dark) { :root { --paper: #111216; --ink: #ecebe5; --muted: #a09e97; --rule: #2a2b31; --signal: #ff6b3d; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
      font: 16px/1.6 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; padding: 24px 16px; }
    main { max-width: 34rem; }
    .code { font: 500 13px/1 Consolas, "Cascadia Mono", monospace; color: var(--signal); letter-spacing: 0.06em; }
    h1 { font: 400 44px/1.05 Georgia, "Times New Roman", serif; margin: 10px 0 12px; }
    p { color: var(--muted); margin: 0 0 22px; }
    nav { display: flex; gap: 18px; flex-wrap: wrap; padding-top: 16px; border-top: 1px solid var(--rule); }
    a { color: var(--ink); font-weight: 600; text-underline-offset: 3px; }
    a:hover { color: var(--signal); }
  </style>
</head>
<body>
  <main>
    <div class="code">404 &middot; no log line for this one</div>
    <h1>This page does not exist.</h1>
    <p>Nothing was found at this address. The portfolio is one world and one page, both a click away.</p>
    <nav><a href="/">Walk into the world</a><a href="/cv/">Open the one-page version</a></nav>
  </main>
</body>
</html>
